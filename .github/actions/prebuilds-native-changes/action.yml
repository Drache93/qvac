name: Diff native sources
description: Whether this event touched a package's native sources, and the hash of its native tree. Never checks out PR code.

inputs:
  workdir:
    description: Package directory, from the selection matrix
    required: true

outputs:
  native_changed:
    description: true when this event's delta touched native files, or the head could not be read
    value: ${{ steps.diff.outputs.native_changed }}
  native_hash:
    description: First 16 hex of the sha256 of the HEAD native tree, the prebuild reuse key
    value: ${{ steps.diff.outputs.native_hash }}

runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        WORKDIR: ${{ inputs.workdir }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BEFORE_SHA: ${{ github.event.before }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: node "$GITHUB_ACTION_PATH/prebuilds-native-changes.mjs"
