name: Install apt packages
description: apt-get update and install a space-separated package list. No-op off Linux or for an empty list.

inputs:
  packages:
    description: Space-separated apt packages
    default: ""

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux' && inputs.packages != ''
      shell: bash
      env:
        PKGS: ${{ inputs.packages }}
      run: |
        sudo apt-get update
        sudo apt-get install -y $PKGS
