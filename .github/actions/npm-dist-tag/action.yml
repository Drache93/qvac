name: npm dist-tag
description: The dist-tag a release goes out under, latest unless it is a prerelease or older than npm's latest.

inputs:
  workdir:
    description: Package directory
    required: true
  tag:
    description: Explicit tag; empty or latest lets the version decide
    default: ""

outputs:
  tag:
    description: Resolved dist-tag
    value: ${{ steps.decide.outputs.tag }}

runs:
  using: composite
  steps:
    - id: decide
      shell: bash
      env:
        WORKDIR: ${{ inputs.workdir }}
        TAG: ${{ inputs.tag }}
      run: node "$GITHUB_ACTION_PATH/npm-dist-tag.mjs"
