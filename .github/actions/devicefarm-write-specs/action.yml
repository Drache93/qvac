name: Generate Device Farm specs
description: Write one Device Farm test spec per test group of a package, each with its own WDIO config.

inputs:
  platform:
    description: Android or iOS
    required: true
  workdir:
    description: Package directory, read for test/mobile/test-groups.json
    required: true
  test-groups:
    description: JSON [{name, grep}] that replaces the package's groups, for a manual tests filter
    default: ""
  enables-perf:
    description: The package's tests emit a perf report
    default: "false"
  mocha-timeout-ms:
    description: WDIO session ceiling
    default: "1800000"
  waitfor-timeout-ms:
    description: WDIO waitforTimeout
    default: "120000"
  extra-pre-test-commands:
    description: Newline-separated host commands run before Appium starts; may hold presigned URLs
    default: ""
  bundle-id:
    description: App bundle id
    default: io.tether.test.qvac

outputs:
  specs:
    description: JSON [{name, grep, tests, file}], one per group
    value: ${{ steps.generate.outputs.specs }}

runs:
  using: composite
  steps:
    - id: generate
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        WORKDIR: ${{ inputs.workdir }}
        TEST_GROUPS: ${{ inputs.test-groups }}
        ENABLES_PERF: ${{ inputs.enables-perf }}
        MOCHA_TIMEOUT_MS: ${{ inputs.mocha-timeout-ms }}
        WAITFOR_MS: ${{ inputs.waitfor-timeout-ms }}
        EXTRA_PRE_TEST: ${{ inputs.extra-pre-test-commands }}
        BUNDLE_ID: ${{ inputs.bundle-id }}
      run: node "$GITHUB_ACTION_PATH/devicefarm-write-specs.mjs"
