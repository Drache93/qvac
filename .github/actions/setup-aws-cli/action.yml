name: Setup AWS CLI
description: Put the AWS CLI on PATH where a self-hosted image lacks it. A no-op where it is already present.

runs:
  using: composite
  steps:
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        command -v aws >/dev/null 2>&1 && exit 0
        for p in /opt/homebrew/bin/aws /usr/local/bin/aws "$HOME/.local/aws-cli/aws"; do
          if [ -x "$p" ]; then dirname "$p" >> "$GITHUB_PATH"; exit 0; fi
        done
        # User-local, since installer -target / needs sudo.
        curl -sSL https://awscli.amazonaws.com/AWSCLIV2.pkg -o "$RUNNER_TEMP/AWSCLIV2.pkg"
        rm -rf "$RUNNER_TEMP/awscli" "$HOME/.local/aws-cli"
        pkgutil --expand-full "$RUNNER_TEMP/AWSCLIV2.pkg" "$RUNNER_TEMP/awscli"
        mkdir -p "$HOME/.local"
        mv "$RUNNER_TEMP/awscli/aws-cli.pkg/Payload/aws-cli" "$HOME/.local/aws-cli"
        echo "$HOME/.local/aws-cli" >> "$GITHUB_PATH"
    - if: runner.os == 'Windows'
      shell: powershell
      run: |
        if (Get-Command aws -ErrorAction SilentlyContinue) { exit 0 }
        Invoke-WebRequest -Uri https://awscli.amazonaws.com/AWSCLIV2.msi -OutFile $env:TEMP\AWSCLIV2.msi
        Start-Process msiexec.exe -Wait -ArgumentList '/I', "$env:TEMP\AWSCLIV2.msi", '/qn'
        echo "C:\Program Files\Amazon\AWSCLIV2" >> $env:GITHUB_PATH
