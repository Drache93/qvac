name: Setup Windows host
description: Long paths, the arm64 SDK workaround and the Visual Studio CMake generator. No-op off Windows.

inputs:
  arch:
    description: x64, arm64 or x86
    required: true

runs:
  using: composite
  steps:
    - if: runner.os == 'Windows'
      shell: powershell
      env:
        INPUT_ARCH: ${{ inputs.arch }}
      run: |
        git config --system core.longpaths true
        if ($env:INPUT_ARCH -eq 'arm64') {
          foreach ($d in 'Include', 'bin', 'Lib') {
            Rename-Item -Path "C:\Program Files (x86)\Windows Kits\10\$d\10.0.26100.0" -NewName "old-10.0.26100.0"
          }
        }
        echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV
        $platform = @{ x64 = 'x64'; arm64 = 'ARM64'; x86 = 'Win32' }[$env:INPUT_ARCH]
        if ($platform) { echo "CMAKE_GENERATOR_PLATFORM=$platform" >> $env:GITHUB_ENV }
