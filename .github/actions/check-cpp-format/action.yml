name: Check C++ format
description: Fail when a package's changed C and C++ lines are not clang-formatted.

inputs:
  repo-dir:
    description: Checkout holding the change, with its history
    required: true
  workdir:
    description: Package directory inside repo-dir
    required: true
  base:
    description: Commit the change is compared with
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.repo-dir }}
      env:
        BASE: ${{ inputs.base }}
        WORKDIR: ${{ inputs.workdir }}
      run: |
        exts=c,cc,cpp,cxx,h,hh,hpp,hxx
        if ! git-clang-format --binary clang-format --extensions "$exts" --diff "$BASE" -- "$WORKDIR"; then
          echo "::error title=Unformatted C++ files::Run git-clang-format --binary clang-format --extensions $exts $BASE -- $WORKDIR"
          exit 1
        fi
