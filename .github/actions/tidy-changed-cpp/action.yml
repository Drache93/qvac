name: Tidy changed C++
description: Run clang-tidy, warnings as errors, on a package's changed sources after bare-make generate.

inputs:
  workdir:
    description: Package directory, inside a checkout with history, holding build/compile_commands.json
    required: true
  base:
    description: Commit the change is compared with
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        BASE: ${{ inputs.base }}
      run: node "$GITHUB_ACTION_PATH/tidy-changed-cpp.mjs"
