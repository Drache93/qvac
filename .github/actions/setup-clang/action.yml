name: Setup Clang
description: Pinned LLVM/Clang on Linux (apt.llvm.org) and Windows (chocolatey), first on PATH. macOS uses Apple Clang.

inputs:
  version:
    description: LLVM major for Linux; must match windows-version's major
    default: "22"
  windows-version:
    description: Exact chocolatey llvm version
    default: 22.1.0

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        sudo chmod 644 /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        wget -q https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh "$LLVM_VERSION" all
        bin="/usr/lib/llvm-${LLVM_VERSION}/bin"
        test -d "$bin" || { echo "::error::$bin missing after install"; exit 1; }
        echo "$bin" >> "$GITHUB_PATH"
    - if: runner.os == 'Windows'
      shell: powershell
      env:
        LLVM_WINDOWS_VERSION: ${{ inputs.windows-version }}
      run: |
        $ErrorActionPreference = 'Stop'
        choco upgrade llvm --version="$env:LLVM_WINDOWS_VERSION" -y --allow-downgrade
        Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin"
