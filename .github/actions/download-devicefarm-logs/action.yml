name: Download Device Farm logs
description: Download each device's console, logcat and host output from Device Farm runs, unpack Customer_Artifacts.zip, and copy the logs with presigned credentials redacted into a directory to upload. The job holds the AWS credentials.

inputs:
  platform:
    description: Android or iOS
    required: true
  run-arns:
    description: JSON array of run ARNs
    required: true

outputs:
  log-dir:
    description: Raw downloads, one directory per run and device
    value: devicefarm-logs/${{ inputs.platform }}
  console-dir:
    description: Scrubbed logs ready to upload
    value: console-logs/${{ inputs.platform }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        RUN_ARNS: ${{ inputs.run-arns }}
        LOG_DIR: devicefarm-logs/${{ inputs.platform }}
        CONSOLE_DIR: console-logs/${{ inputs.platform }}
      run: node "$GITHUB_ACTION_PATH/download-devicefarm-logs.mjs"
