name: Cache save
description: actions/cache/save, pinned once. Call it only from trusted events.

inputs:
  path:
    description: Newline-separated paths to save
    required: true
  key:
    description: Cache key
    required: true

runs:
  using: composite
  steps:
    - uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
