name: PR checks

# Lint, typecheck, unit tests and generated files for the changed packages on the CI contract and their dependents,
# run through Nx from the PR's own targets: no secrets here, so the PR's tree is safe to execute and forks get real results.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, release-*, feature-*, tmp-*]
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package names or directories; empty selects every package on the contract
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    uses: ./.github/workflows/_select-projects.yml
    with:
      targets: lint,typecheck,test:unit,verify:generated
      packages: ${{ inputs.packages }}

  checks:
    needs: select
    if: needs.select.outputs.any == 'true'
    name: checks (${{ matrix.project.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_DAEMON: "false"
      NX_NO_CLOUD: "true"
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.select.outputs.projects) }}
    steps:
      - name: Checkout actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: feat/package-ci-contract-pilot-vla  # TEMP rehearsal: the pilot branch until merge
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Checkout pull request
        uses: tetherto/qvac-actions/checkout@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: src
          persist-credentials: "false"
      - uses: tetherto/qvac-actions/setup-node@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          node-version: "22"
      - uses: tetherto/qvac-actions/setup-pnpm@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          package-json-file: src/package.json
      # A workspace install, so a package checks against its dependencies' sources in this PR, not their published builds.
      - working-directory: src
        run: |
          pnpm install --frozen-lockfile
          npm install --global --force bare --registry=https://registry.npmjs.org/
      - name: typecheck
        if: contains(matrix.project.targets, 'typecheck')
        working-directory: src
        env:
          PROJECT: ${{ matrix.project.name }}
        run: pnpm exec nx run "$PROJECT:typecheck" --outputStyle=stream
      - name: lint
        if: contains(matrix.project.targets, 'lint')
        working-directory: src
        env:
          PROJECT: ${{ matrix.project.name }}
        run: pnpm exec nx run "$PROJECT:lint" --outputStyle=stream
      - name: test:unit
        if: contains(matrix.project.targets, 'test:unit')
        working-directory: src
        env:
          PROJECT: ${{ matrix.project.name }}
        run: pnpm exec nx run "$PROJECT:test:unit" --outputStyle=stream
      - name: verify:generated
        if: contains(matrix.project.targets, 'verify:generated')
        working-directory: src
        env:
          PROJECT: ${{ matrix.project.name }}
        run: pnpm exec nx run "$PROJECT:verify:generated" --outputStyle=stream
