name: Publish to npm

# Release publishing for packages on the CI contract: a push to release-<dir>-x.y.z builds and publishes that package alone.
on:
  push:
    branches: [release-*, "!release-train-*"]
    paths: ["packages/**"]
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package names or directories to publish
        type: string
        required: true
      npm_tag:
        description: npm dist-tag override; empty uses the package's own, else latest
        type: string
        default: ""
      dry_run:
        description: Build and pack without publishing or tagging
        type: boolean
        default: false
  # Registers the workflow from a branch; every job is off for this event.
  pull_request:
    paths: [.github/workflows/publish-npm.yml]

permissions: {}

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/_select-projects.yml
    with:
      targets: build,verify:generated,publish
      packages: ${{ inputs.packages }}
      mode: owners

  logic:
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish_release: ${{ startsWith(github.ref_name, 'release-') }}
    steps:
      - name: Checkout actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: feat/package-ci-contract-pilot-vla  # TEMP rehearsal: the pilot branch until merge
          sparse-checkout: .github/actions
          persist-credentials: false
      - if: startsWith(github.ref_name, 'release-')
        uses: ./.github/actions/check-release-branch
        with:
          packages: ${{ toJSON(fromJSON(needs.select.outputs.projects).*.slug) }}

  # git diff runs in the workspace root, so the pushed release commit is checked out there, as on the old path.
  release-merge-guard:
    needs: [select, logic]
    if: startsWith(github.ref_name, 'release-')
    name: release-merge-guard ${{ matrix.project.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.select.outputs.projects) }}
    steps:
      - name: Checkout source and actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-merge-guard
        with:
          base-ref: ${{ github.ref_name }}
          base-sha: ${{ github.event.before }}
          head-sha: ${{ github.sha }}
          package-slug: ${{ matrix.project.slug }}
          package-json-path: ${{ matrix.project.dir }}/package.json
          changelog-path: ${{ matrix.project.dir }}/CHANGELOG.md

  verify:
    needs: select
    if: toJSON(fromJSON(needs.select.outputs.matrices)['verify:generated']) != '[]'
    name: verify:generated ${{ matrix.row.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.select.outputs.matrices)['verify:generated'] }}
    steps:
      - name: Checkout actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: feat/package-ci-contract-pilot-vla  # TEMP rehearsal: the pilot branch until merge
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Checkout source
        uses: ./.github/actions/checkout
        with:
          path: src
          persist-credentials: "false"
      # As pr-checks runs it: Node 22, which pnpm 11 needs, a workspace install, and the target through Nx.
      - uses: ./.github/actions/setup-node
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-pnpm
        with:
          package-json-file: src/package.json
      - shell: bash
        working-directory: src
        env:
          PROJECT: ${{ matrix.row.project }}
          NX_DAEMON: "false"
          NX_NO_CLOUD: "true"
        run: |
          pnpm install --frozen-lockfile
          pnpm exec nx run "$PROJECT:verify:generated" --outputStyle=stream

  build:
    needs: [select, logic]
    if: toJSON(fromJSON(needs.select.outputs.matrices).build) != '[]'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      rows: ${{ toJSON(fromJSON(needs.select.outputs.matrices).build) }}

  publish:
    needs: [select, logic, release-merge-guard, verify, build]
    if: >-
      always() && !cancelled() && needs.logic.result == 'success' && toJSON(fromJSON(needs.select.outputs.matrices).publish) != '[]' &&
      (needs.release-merge-guard.result == 'success' || needs.release-merge-guard.result == 'skipped') &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.logic.outputs.publish_release == 'true' || inputs.dry_run)
    name: publish ${{ matrix.row.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ !inputs.dry_run && 'npm' || '' }}
    permissions:
      contents: write
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.select.outputs.matrices).publish }}
    outputs:
      published_version: ${{ steps.publish.outputs.version }}
    env:
      WORKDIR: src/${{ matrix.row.dir }}
    steps:
      - name: Checkout actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: feat/package-ci-contract-pilot-vla  # TEMP rehearsal: the pilot branch until merge
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Checkout source
        uses: ./.github/actions/checkout
        with:
          path: src
          persist-credentials: "false"
      # The legs straight into place, which is what a merged bundle would hold.
      - if: contains(matrix.row.targets, 'build')
        uses: ./.github/actions/download-artifact
        with:
          pattern: prebuild-${{ matrix.row.slug }}-*
          path: ${{ runner.temp }}/prebuilds
          merge-multiple: "true"
      - if: contains(matrix.row.targets, 'build')
        uses: ./.github/actions/place-prebuilds
        with:
          staging: ${{ runner.temp }}/prebuilds
          workdir: ${{ env.WORKDIR }}
          extra-dirs: ${{ join(matrix.row.meta.prebuildExtraDirs, ' ') }}
      # Again at the last step: whatever the selection did, a release ref publishes its own package at its own version.
      - if: startsWith(github.ref_name, 'release-')
        uses: ./.github/actions/check-release-branch
        with:
          packages: ${{ toJSON(fromJSON(needs.select.outputs.matrices).publish.*.slug) }}
          workdir: ${{ env.WORKDIR }}
      - if: inputs.npm_tag != ''
        shell: bash
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$' <<< "$NPM_TAG" || { echo "::error::Invalid npm dist-tag '$NPM_TAG'"; exit 1; }
      # npm 11.5 or newer for OIDC trusted publishing; 24.14.1 ships 11.11.0.
      - uses: ./.github/actions/setup-node
        with:
          node-version: "24.14.1"
          registry-url: https://registry.npmjs.org/
          scope: "@qvac"
      - id: dist-tag
        uses: ./.github/actions/npm-dist-tag
        with:
          workdir: ${{ env.WORKDIR }}
          tag: ${{ matrix.row.meta.npmTagOverride || inputs.npm_tag || 'latest' }}
      - id: publish
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/publish-npm
        with:
          workdir: ${{ env.WORKDIR }}
          tag: ${{ steps.dist-tag.outputs.tag }}
      - if: inputs.dry_run
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: |
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/pack.json"
          {
            echo "## Dry run: $(jq -r '.[0].id' "$RUNNER_TEMP/pack.json") with tag $DIST_TAG"
            echo
            echo '```'
            jq -r '.[0].files[] | "\(.size)\t\(.path)"' "$RUNNER_TEMP/pack.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  create-tag:
    needs: [select, publish]
    if: needs.publish.result == 'success' && needs.publish.outputs.published_version != ''
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.select.outputs.matrices).publish }}
    permissions:
      contents: write
    uses: ./.github/workflows/create-release-tag.yml
    with:
      repo_name: ${{ matrix.row.meta.repoName }}
      published_version: ${{ needs.publish.outputs.published_version }}
