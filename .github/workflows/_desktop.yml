name: Desktop tests

# One job per row of the targets that test the built addon on a desktop runner: test:integration, test:backend.
on:
  workflow_call:
    inputs:
      rows:
        description: JSON rows of every desktop target
        type: string
        required: true
      sources:
        description: JSON map of package directory to the run holding its prebuilds-<slug> bundle
        type: string
        required: true
      deps:
        description: JSON map of awaited dependency key to its producing run id
        type: string
        default: "{}"

permissions: {}

jobs:
  test:
    if: inputs.rows != '[]'
    name: ${{ matrix.row.slug }} ${{ matrix.row.target }} ${{ matrix.row.platform }}-${{ matrix.row.arch }} (${{ matrix.row.runnerKey }})
    runs-on: ${{ matrix.row.runner }}
    environment: release
    timeout-minutes: ${{ matrix.row.timeout || 60 }}
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(inputs.rows) }}
    env:
      WORKDIR: src/${{ matrix.row.dir }}
      SOURCE: ${{ fromJSON(inputs.sources)[matrix.row.dir] }}
    steps:
      - name: Checkout actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: feat/package-ci-contract-pilot-vla  # TEMP rehearsal: the pilot branch until merge
          sparse-checkout: |
            .github/actions
            .github/scripts
            .github/config
            scripts/perf-report
            scripts/test-utils
          persist-credentials: false
      - name: Checkout source
        uses: tetherto/qvac-actions/checkout@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: src
          persist-credentials: "false"
      - uses: tetherto/qvac-actions/setup-node@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
      - if: matrix.row.commands['ci:setup']
        shell: bash
        working-directory: src/${{ matrix.row.commands['ci:setup'].cwd }}
        env:
          COMMAND: ${{ matrix.row.commands['ci:setup'].command }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: bash -c "$COMMAND"
      - shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: npm install
      - if: matrix.row.waits[0] && fromJSON(inputs.deps)[matrix.row.waits[0].key]
        uses: tetherto/qvac-actions/download-artifact@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          name: ${{ matrix.row.waits[0].artifact }}
          run-id: ${{ fromJSON(inputs.deps)[matrix.row.waits[0].key] }}
          path: ${{ runner.temp }}/dep-prebuilds
      - if: matrix.row.waits[0] && fromJSON(inputs.deps)[matrix.row.waits[0].key]
        shell: bash
        run: node .github/scripts/overlay-prebuilds.mjs --workdir "$WORKDIR" --package "${{ matrix.row.waits[0].npm }}" --src "$RUNNER_TEMP/dep-prebuilds" --platform "${{ matrix.row.platform }}" --arch "${{ matrix.row.arch }}"
      - shell: bash
        run: npm install -g --force bare bare-make@1.8.0 bare-runtime bare-https brittle
      # The bundle comes from this run, or from the earlier run whose prebuilds are reused.
      - uses: tetherto/qvac-actions/download-artifact@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          name: prebuilds-${{ matrix.row.slug }}
          run-id: ${{ env.SOURCE != github.run_id && env.SOURCE || '' }}
          path: ${{ runner.temp }}/prebuilds-staging
      - uses: ./.github/actions/prebuilds-place
        with:
          staging: ${{ runner.temp }}/prebuilds-staging
          workdir: ${{ env.WORKDIR }}
          platform: ${{ matrix.row.platform }}
          arch: ${{ matrix.row.arch }}
      # binding.js loads the host's platform package; link:platform wraps prebuilds/<host>/ as that package.
      - shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.["link:platform"] ? 0 : 1)'; then npm run link:platform; fi
      - if: matrix.row.platform == 'linux' && matrix.row.arch == 'arm64'
        uses: tetherto/qvac-actions/runner-apt-install@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          packages: ${{ join(matrix.row.meta.linuxArmApt, ' ') }}
      - uses: tetherto/qvac-actions/setup-aws-cli@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
      - uses: tetherto/qvac-actions/configure-aws-credentials@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1
      - id: models
        uses: ./.github/actions/models-cache-key
        with:
          workdir: ${{ env.WORKDIR }}
          target: ${{ matrix.row.target }}
      - if: runner.environment != 'github-hosted'
        uses: tetherto/qvac-actions/cache-restore@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          key: ${{ steps.models.outputs.key }}
          restore-keys: ${{ steps.models.outputs.restore-prefix }}
          path: ${{ steps.models.outputs.paths }}
          enable-cross-os-archive: "true"
      - uses: ./.github/actions/models-download
        with:
          workdir: ${{ env.WORKDIR }}
          bucket: ${{ secrets.MODEL_S3_BUCKET }}
          target: ${{ matrix.row.target }}
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-vulkan
        with:
          arch: ${{ matrix.row.arch }}
      # Diagnostic: the addon's DLL imports, for when LoadLibrary misses one.
      - if: runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ env.WORKDIR }}
        run: |
          $addon = Get-ChildItem -Recurse -Filter '*.bare' prebuilds/ | Select-Object -First 1
          $dumpbin = Get-ChildItem -Path 'C:\Program Files\Microsoft Visual Studio', 'C:\Program Files (x86)\Microsoft Visual Studio' -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($addon -and $dumpbin) { & $dumpbin.FullName /dependents $addon.FullName }
      - name: ${{ matrix.row.target }}
        shell: bash
        working-directory: src/${{ matrix.row.cwd }}
        env:
          COMMAND: ${{ matrix.row.command }}
        run: bash -c "$COMMAND"
      - name: perf summary
        if: always() && !cancelled()
        shell: bash
        run: |
          shopt -s nullglob
          for r in "$WORKDIR"/test/results/performance-report*.json; do
            node scripts/perf-report/render-step-summary.js "$r" "$GITHUB_STEP_SUMMARY"
          done
      - if: always() && !cancelled()
        uses: tetherto/qvac-actions/upload-artifact@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          name: ${{ matrix.row.slug }}-perf-${{ matrix.row.platform }}-${{ matrix.row.arch }}-${{ matrix.row.runnerKey }}-${{ strategy.job-index }}
          path: ${{ env.WORKDIR }}/test/results/performance-report*.json
          if-no-files-found: ignore
          retention-days: "14"
