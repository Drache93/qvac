name: Desktop tests

# Each package's desktop targets (test:integration, test:backend) through Nx, one job per leg on the runner its
# configuration names. Nx builds the package and its native dependencies on that machine before the tests.
on:
  workflow_call:
    inputs:
      rows:
        description: JSON rows of every desktop target
        type: string
        required: true

permissions: {}

jobs:
  test:
    if: inputs.rows != '[]'
    name: ${{ matrix.row.slug }} ${{ matrix.row.target }} ${{ matrix.row.config }}
    runs-on: ${{ matrix.row.runner }}
    environment: release
    timeout-minutes: ${{ matrix.row.timeout || 180 }}
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(inputs.rows) }}
    env:
      WORKDIR: src/${{ matrix.row.dir }}
      NX_DAEMON: "false"
      NX_NO_CLOUD: "true"
    steps:
      - name: Checkout actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: feat/package-ci-contract-pilot-vla  # TEMP rehearsal: the pilot branch until merge
          sparse-checkout: |
            .github/actions
            .github/config
          persist-credentials: false
      - name: Checkout source
        uses: tetherto/qvac-actions/checkout@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: src
          persist-credentials: "false"
      - uses: tetherto/qvac-actions/setup-node@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
      - uses: tetherto/qvac-actions/setup-pnpm@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          package-json-file: src/package.json
      - if: runner.environment == 'github-hosted'
        uses: tetherto/qvac-actions/setup-clang@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          version: ${{ matrix.row.toolchain.llvm.linux }}
          windows-version: ${{ matrix.row.toolchain.llvm.windows }}
      - uses: tetherto/qvac-actions/configure-aws-credentials@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1
      - uses: tetherto/qvac-actions/setup-aws-cli@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
      - uses: ./.github/actions/vcpkg-bootstrap
      - uses: ./.github/actions/vcpkg-cache-setup
        with:
          mode: s3
          cache-bucket: ${{ secrets.MODEL_S3_BUCKET }}
          platform: ${{ matrix.row.platform }}
          arch: ${{ matrix.row.arch }}
      - uses: ./.github/actions/setup-windows-host
        with:
          arch: ${{ matrix.row.arch }}
      - uses: ./.github/actions/setup-apple-clang
      - uses: ./.github/actions/setup-vulkan
        with:
          arch: ${{ matrix.row.arch }}
          cache-bucket: ${{ secrets.MODEL_S3_BUCKET }}
      # A leg's extra host setup comes from its configuration's ci.setup; the version is the workspace pin.
      - if: contains(matrix.row.setup, 'cuda')
        uses: ./.github/actions/setup-cuda
        with:
          cuda-version: ${{ matrix.row.toolchain.cuda }}
      - id: models
        uses: ./.github/actions/models-cache-key
        with:
          workdir: ${{ env.WORKDIR }}
          target: ${{ matrix.row.target }}
      - if: runner.environment != 'github-hosted'
        uses: tetherto/qvac-actions/cache-restore@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          key: ${{ steps.models.outputs.key }}
          restore-keys: ${{ steps.models.outputs.restore-prefix }}
          path: ${{ steps.models.outputs.paths }}
          enable-cross-os-archive: "true"
      - uses: ./.github/actions/models-download
        with:
          workdir: ${{ env.WORKDIR }}
          bucket: ${{ secrets.MODEL_S3_BUCKET }}
          target: ${{ matrix.row.target }}
      - name: Install
        shell: bash
        working-directory: src
        env:
          NPM: ${{ matrix.row.npm }}
        run: pnpm install --frozen-lockfile --filter . --filter "$NPM..."
      - name: ${{ matrix.row.target }}
        shell: bash
        working-directory: src
        env:
          PROJECT: ${{ matrix.row.project }}
          TARGET: ${{ matrix.row.target }}
          CONFIG: ${{ matrix.row.config }}
        run: pnpm exec nx run-many -t "ci:system,$TARGET" -p "$PROJECT" -c "$CONFIG" --parallel=1 --outputStyle=stream
      # Diagnostic: the addon's DLL imports, for when LoadLibrary misses one.
      - if: failure() && runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ env.WORKDIR }}
        run: |
          $addon = Get-ChildItem -Recurse -Filter '*.bare' prebuilds/ -ErrorAction SilentlyContinue | Select-Object -First 1
          $dumpbin = Get-ChildItem -Path 'C:\Program Files\Microsoft Visual Studio', 'C:\Program Files (x86)\Microsoft Visual Studio' -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($addon -and $dumpbin) { & $dumpbin.FullName /dependents $addon.FullName }
      - if: always() && !cancelled()
        uses: tetherto/qvac-actions/upload-artifact@6173f30c9cf1c86da15d6ddb4674060b3335ec4d  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          name: ${{ matrix.row.slug }}-perf-${{ matrix.row.target }}-${{ matrix.row.config }}
          path: ${{ env.WORKDIR }}/test/results/performance-report*.json
          if-no-files-found: ignore
          retention-days: "14"
