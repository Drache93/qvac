name: General CI/CD (cli)

on:
  push:
    branches:
      - main
      - release-*
      # release-train-* branches publish from release-train.yml.
      - "!release-train-*"
      - feature-*
      - tmp-*
    paths:
      - "packages/cli/**"
      - ".github/workflows/trigger-reusable-lib-cli.yml"
  workflow_dispatch:
    inputs:
      custom_input_1:
        required: false
        type: string
      custom_input_2:
        required: false
        type: string
      custom_input_3:
        required: false
        type: string
      npm_tag:
        description: "NPM dist-tag (default: latest). e.g. release-1.x"
        required: false
        default: ""
        type: string

env:
  WORKDIR: packages/cli

permissions:
  contents: read

jobs:
  release-merge-guard:
    name: Release Merge Guard
    if: >-
      startsWith(github.ref_name, 'release-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-merge-guard
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ github.ref_name }}
          base-sha: ${{ github.event.before }}
          head-sha: ${{ github.sha }}
          package-slug: cli
          package-json-path: packages/cli/package.json
          changelog-path: packages/cli/CHANGELOG.md
          strict-slug: true

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Workspace SDK compiles in-repo inference + SDK; keep a cap so a hung
    # npm install cannot sit on the runner indefinitely.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 22

      # The distribution uses reviewed SDK/inference snapshots from this commit.
      # Materialize their pinned native assets before npm copies local packages.
      - name: Prepare runtime snapshots
        run: node scripts/prepare-qvac-vendors.mjs
        working-directory: ${{ env.WORKDIR }}

      - name: Install dependencies
        run: npm ci --ignore-scripts --install-links
        working-directory: ${{ env.WORKDIR }}

      - name: Run format
        run: npm run format
        working-directory: ${{ env.WORKDIR }}

      - name: Run lint
        run: npm run lint
        working-directory: ${{ env.WORKDIR }}

      - name: Run typecheck
        run: npm run typecheck
        working-directory: ${{ env.WORKDIR }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.WORKDIR }}

      - name: Run tests
        run: npm test
        working-directory: ${{ env.WORKDIR }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: cli-dist
          path: ${{ env.WORKDIR }}/dist/
          retention-days: 30

  publish-logic:
    runs-on: ubuntu-latest
    outputs:
      publish_main: ${{ steps.logic.outputs.publish_main }}
      publish_release: ${{ steps.logic.outputs.publish_release }}
      publish_feature: ${{ steps.logic.outputs.publish_feature }}
      publish_tmp: ${{ steps.logic.outputs.publish_tmp }}
      gpr_tag: ${{ steps.logic.outputs.gpr_tag }}
    steps:
      - id: logic
        uses: tetherto/qvac-actions/npm-publish-logic@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0

  publish-main-gpr-dev:
    needs:
      - build
      - publish-logic
    if: (needs.publish-logic.outputs.publish_main == 'true')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: ./.github/actions/download-release-artifact
        with:
          name: cli-dist
          path: ${{ env.WORKDIR }}/dist/

      - name: Publish to GitHub Packages (dev)
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.publish-logic.outputs.gpr_tag }}
          workdir: packages/cli
          name-suffix: "-mono"
          pack-script: pack:local

  publish-release-npm:
    needs:
      - build
      - publish-logic
      - release-merge-guard
    if: >-
      (needs.publish-logic.outputs.publish_release == 'true' && needs.release-merge-guard.result == 'success')
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Validate npm_tag input
        if: inputs.npm_tag != ''
        shell: bash
        env:
          NPM_TAG_INPUT: ${{ inputs.npm_tag }}
        run: |
          if ! echo "$NPM_TAG_INPUT" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
            echo "::error::Invalid npm dist-tag '$NPM_TAG_INPUT'. Must match ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ (e.g. release-1.x)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Download build artifacts
        uses: ./.github/actions/download-release-artifact
        with:
          name: cli-dist
          path: ${{ env.WORKDIR }}/dist/

      - name: Determine dist-tag
        id: dist-tag
        uses: tetherto/qvac-actions/npm-dist-tag-determination@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          workdir: ${{ env.WORKDIR }}
          tag: ${{ inputs.npm_tag }}

      - name: Setup Node for trusted publishing
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Assemble and publish verified archive
        id: publish
        working-directory: ${{ env.WORKDIR }}
        env:
          PUBLISH_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: |
          set -euo pipefail
          archive_dir=$(mktemp -d "$RUNNER_TEMP/cli-package.XXXXXX")
          npm run pack:local -- "$archive_dir"
          shopt -s nullglob
          archives=("$archive_dir"/*.tgz)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one CLI archive"
            exit 1
          fi
          npm publish "${archives[0]}" --tag "$PUBLISH_TAG" --access public --provenance
          version=$(node -p "require('./package.json').version")
          echo "npm_published_version=$version" >> "$GITHUB_OUTPUT"

  # Tag the published version (no GitHub Release; SDK-only releases policy)
  create-tag:
    needs: [publish-release-npm]
    if: needs.publish-release-npm.result == 'success' && needs.publish-release-npm.outputs.published_version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/create-release-tag.yml
    with:
      repo_name: "cli"
      published_version: ${{ needs.publish-release-npm.outputs.published_version }}

  publish-feature-gpr:
    needs:
      - build
      - publish-logic
    if: (needs.publish-logic.outputs.publish_feature == 'true')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: ./.github/actions/download-release-artifact
        with:
          name: cli-dist
          path: ${{ env.WORKDIR }}/dist/

      - name: Publish to GitHub Packages (feature)
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.publish-logic.outputs.gpr_tag }}
          workdir: packages/cli
          name-suffix: "-mono"
          pack-script: pack:local

  publish-tmp-gpr:
    needs:
      - build
      - publish-logic
    if: (needs.publish-logic.outputs.publish_tmp == 'true')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: ./.github/actions/download-release-artifact
        with:
          name: cli-dist
          path: ${{ env.WORKDIR }}/dist/

      - name: Publish to GitHub Packages (tmp)
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.publish-logic.outputs.gpr_tag }}
          workdir: packages/cli
          name-suffix: "-mono"
          pack-script: pack:local
