name: PR build and test

# Native builds, C++ lint and tests, and desktop tests for packages on the CI contract, after trust and approval.
on:
  # TEMP rehearsal: pull_request until merge, since pull_request_target runs main's copy, which does not exist yet.
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    branches: [main, release-*, feature-*, tmp-*]
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package names or directories; empty selects by change
        type: string
        default: ""

permissions: {}

concurrency:
  group: pr-build-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    permissions:
      contents: read
    uses: ./.github/workflows/_select-projects.yml
    with:
      targets: ci:setup,build,cpp:lint,cpp:build,cpp:tests,test:integration,test:backend
      combine: desktop=test:integration+test:backend
      packages: ${{ inputs.packages }}

  fork-approval:
    needs: select
    if: needs.select.outputs.any == 'true'
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml

  # Labels to stages, as main's ci-router: independent of approval, so a skip still reads as a routing choice.
  route:
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_verified_checks: ${{ steps.route.outputs.run_verified_checks }}
      run_prebuilds: ${{ steps.route.outputs.run_prebuilds }}
      run_cpp_tests: ${{ steps.route.outputs.run_cpp_tests }}
      run_desktop: ${{ steps.route.outputs.run_desktop }}
    steps:
      - name: Checkout actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: route
        uses: ./.github/actions/route-ci

  trust:
    needs: [select, fork-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      allowed: ${{ steps.trust.outputs.allowed }}
    steps:
      - name: Checkout actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: trust
        uses: ./.github/actions/check-pr-trust
        with:
          github-token: ${{ github.token }}

  # A package whose native sources did not change since an earlier run of this PR reuses that run's prebuilds.
  reuse:
    needs: [select, route, trust]
    if: needs.trust.outputs.allowed == 'true' && needs.route.outputs.run_prebuilds == 'true'
    name: reuse ${{ matrix.project.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.select.outputs.projects) }}
    steps:
      - name: Checkout actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: diff
        if: contains(matrix.project.targets, 'build')
        uses: ./.github/actions/diff-native-sources
        with:
          workdir: ${{ matrix.project.dir }}
      - id: find
        if: steps.diff.outputs.native_changed == 'false' && toJSON(matrix.project.waits) == '[]' && github.event_name == 'pull_request'
        uses: ./.github/actions/find-prebuild-run
        with:
          github-token: ${{ github.token }}
          workflow-file: pr-build-test.yml
          marker: prebuilds-cache-pr-${{ github.event.pull_request.number }}-${{ matrix.project.slug }}-${{ steps.diff.outputs.native_hash }}
          artifact-name: prebuilds-${{ matrix.project.slug }}
      - shell: bash
        env:
          DIR: ${{ matrix.project.dir }}
          HIT: ${{ steps.find.outputs.hit == 'true' }}
          RUN_ID: ${{ steps.find.outputs.run-id }}
          HASH: ${{ steps.diff.outputs.native_hash }}
        run: |
          jq -n --arg dir "$DIR" --argjson hit "$HIT" --arg runId "$RUN_ID" --arg hash "$HASH" '{dir: $dir, hit: $hit, runId: $runId, hash: $hash}' > "$RUNNER_TEMP/plan.json"
      - uses: ./.github/actions/upload-artifact
        with:
          name: plan-${{ matrix.project.slug }}
          path: ${{ runner.temp }}/plan.json

  # Build rows minus reused packages, where each package's prebuilds come from, and awaited dependency runs.
  plan:
    needs: [select, route, trust, reuse]
    if: always() && !cancelled() && needs.trust.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 190
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sources: ${{ steps.plan.outputs.sources }}
      deps: ${{ steps.plan.outputs.deps }}
      reused: ${{ steps.plan.outputs.reused }}
      hashes: ${{ steps.plan.outputs.hashes }}
    steps:
      - name: Checkout actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/actions
            .github/scripts
          persist-credentials: false
      - if: needs.reuse.result == 'success'
        uses: ./.github/actions/download-artifact
        with:
          pattern: plan-*
          path: ${{ runner.temp }}/plans
      - id: plan
        shell: bash
        env:
          PROJECTS: ${{ needs.select.outputs.projects }}
          BUILD: ${{ toJSON(fromJSON(needs.select.outputs.matrices).build) }}
          PLANS_DIR: ${{ runner.temp }}/plans
          AWAIT: ${{ github.event_name == 'pull_request' && needs.route.outputs.run_prebuilds == 'true' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        run: node .github/scripts/plan-pr-build.mjs

  build:
    needs: [route, plan]
    if: needs.route.outputs.run_prebuilds == 'true' && needs.plan.outputs.build != '[]'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      rows: ${{ needs.plan.outputs.build }}
      deps: ${{ needs.plan.outputs.deps }}

  # Folds a package's legs into prebuilds-<slug>, and marks the run so a later push of this PR can reuse it.
  merge:
    needs: [select, plan, build]
    name: merge ${{ matrix.project.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.select.outputs.projects) }}
    env:
      BUILT: ${{ contains(matrix.project.targets, 'build') && !fromJSON(needs.plan.outputs.reused)[matrix.project.dir] }}
      HASH: ${{ fromJSON(needs.plan.outputs.hashes)[matrix.project.dir] }}
    steps:
      - name: Checkout actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions
          persist-credentials: false
      - if: env.BUILT == 'true'
        uses: ./.github/actions/download-artifact
        with:
          pattern: prebuild-${{ matrix.project.slug }}-*
          path: prebuilds
          merge-multiple: "true"
      - if: env.BUILT == 'true'
        uses: ./.github/actions/upload-artifact
        with:
          name: prebuilds-${{ matrix.project.slug }}
          path: prebuilds
      - if: env.BUILT == 'true' && env.HASH != '' && github.event_name == 'pull_request'
        shell: bash
        run: echo "$HASH" > "$RUNNER_TEMP/marker"
      - if: env.BUILT == 'true' && env.HASH != '' && github.event_name == 'pull_request'
        uses: ./.github/actions/upload-artifact
        with:
          name: prebuilds-cache-pr-${{ github.event.pull_request.number }}-${{ matrix.project.slug }}-${{ env.HASH }}
          path: ${{ runner.temp }}/marker

  # The grant covers every job in _cpp.yml, even the one these inputs skip.
  cpp-lint:
    needs: [select, route, plan]
    if: needs.route.outputs.run_verified_checks == 'true'
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    uses: ./.github/workflows/_cpp.yml
    secrets: inherit
    with:
      lint-rows: ${{ toJSON(fromJSON(needs.select.outputs.matrices)['cpp:lint']) }}
      deps: ${{ needs.plan.outputs.deps }}

  cpp-tests:
    needs: [select, route, plan]
    if: needs.route.outputs.run_cpp_tests == 'true'
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    uses: ./.github/workflows/_cpp.yml
    secrets: inherit
    with:
      rows: ${{ toJSON(fromJSON(needs.select.outputs.matrices)['cpp:tests']) }}
      deps: ${{ needs.plan.outputs.deps }}

  desktop:
    needs: [select, route, plan, build, merge]
    if: always() && !cancelled() && needs.route.outputs.run_desktop == 'true' && needs.plan.result == 'success' && (needs.merge.result == 'success' || needs.plan.outputs.build == '[]')
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    uses: ./.github/workflows/_desktop.yml
    secrets: inherit
    with:
      rows: ${{ toJSON(fromJSON(needs.select.outputs.matrices).desktop) }}
      sources: ${{ needs.plan.outputs.sources }}
      deps: ${{ needs.plan.outputs.deps }}

  # The gate's qvac/prebuild-<key> and qvac/cpp-tests-<key>; a skip passes only when routing chose not to run.
  status:
    needs: [select, route, plan, build, merge, cpp-tests]
    if: always() && !cancelled() && github.event_name == 'pull_request' && needs.select.outputs.any == 'true'
    name: status ${{ matrix.project.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.select.outputs.projects) }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CI_ROUTER_RESULT: ${{ needs.route.result }}
    steps:
      - name: Checkout actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/prebuild-status
          persist-credentials: false
      - if: matrix.project.prebuildStatus
        shell: bash
        env:
          PREBUILD_RESULT: ${{ needs.build.result == 'success' && needs.merge.result || needs.build.result }}
          REUSE_HIT: ${{ needs.plan.outputs.reused && fromJSON(needs.plan.outputs.reused)[matrix.project.dir] }}
          RUN_PREBUILDS: ${{ needs.route.outputs.run_prebuilds }}
          CONTEXT: qvac/prebuild-${{ matrix.project.key }}
        run: node .github/scripts/prebuild-status/publish.mjs
      - if: matrix.project.cppStatus
        shell: bash
        env:
          CPP_TEST_RESULT: ${{ needs.cpp-tests.result }}
          REUSE_HIT: ""
          RUN_CPP_TESTS: ${{ needs.route.outputs.run_cpp_tests }}
          CONTEXT: qvac/cpp-tests-${{ matrix.project.key }}
          KIND: cpp-tests
        run: node .github/scripts/prebuild-status/publish.mjs

  # Not named qvac-merge-guard: that is the required check's job, and a second one would share its context.
  summary:
    needs: [select, fork-approval, route, trust, reuse, plan, build, merge, cpp-lint, cpp-tests, desktop, status]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' <<< "$NEEDS" > /dev/null
