# Build-only workflow. Publishing lives in on-merge-nx.yml.
name: Prebuilds (GGML Classification)

on:
  workflow_dispatch:
    inputs:
      assets_only:
        description: "Prepare diagnostic assets without rebuilding the addon"
        type: boolean
        default: false
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/classification-ggml"

  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
        default: "tetherto/qvac"
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/classification-ggml"
      fabric-overlay-artifact:
        description: >-
          Workflow-run artifact name for PR-built @qvac/fabric prebuilds. Empty
          skips the overlay (published npm baseline).
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prebuild:
    if: inputs.assets_only != true
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-prebuilds.yml
    with:
      workdir: ${{ inputs.workdir }}
      ref: ${{ inputs.ref }}
      repository: ${{ inputs.repository }}
      # classification-ggml builds the GGML_BACKEND_DL fabric (gpu-backends), so
      # the build host needs the Vulkan SDK (incl. glslc) to compile the
      # ggml-vulkan module from source on cache-miss — same as the other
      # gpu-backends consumers (vla/embed/llm/nmtcpp/ocr). The consumer-side
      # find_dependency(Vulkan) is separately removed under DL by qvac-fabric
      # 8828.0.2#5, but the fabric's own Vulkan backend build still needs it.
      include-vulkan-sdk: true
      fabric-overlay-artifact: ${{ inputs.fabric-overlay-artifact }}
      matrix-include: '[{"os":"ubuntu-24.04","runner_key":"ubuntu_2404","platform":"android","arch":"arm64"}]'
    secrets: inherit

  diagnostic-device-inventory:
    if: inputs.assets_only != true
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2
      - name: List Android diagnostic candidates
        run: >-
          aws devicefarm list-devices
          --filters '[{"attribute":"PLATFORM","operator":"EQUALS","values":["ANDROID"]}]'
          --query 'devices[?contains(model, `Galaxy S2`) || contains(model, `Pixel 9 Pro`)].{model:model,os:os,availability:availability,cpu:cpu.model}'
          --output json

  diagnostic-assets:
    if: inputs.assets_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # 5.6.0
        with:
          python-version: '3.12'
      - name: Install reference-only Python tools
        run: python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install safetensors==0.6.2 pillow numpy
      - name: Prepare original PyTorch references and pinned public images
        run: python packages/classification-ggml/scripts/prepare-megaloc-diagnostics.py --output diagnostic-assets
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: megaloc-diagnostic-assets
          path: diagnostic-assets
          retention-days: 7
