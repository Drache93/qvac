# Build-only workflow. Publishing lives in on-merge-nx.yml.
name: Prebuilds (GGML Classification)

on:
  workflow_dispatch:
    inputs:
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/classification-ggml"

  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
        default: "tetherto/qvac"
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/classification-ggml"
      fabric-overlay-artifact:
        description: >-
          Workflow-run artifact name for PR-built @qvac/fabric prebuilds. Empty
          skips the overlay (published npm baseline).
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prebuild:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-prebuilds.yml
    with:
      workdir: ${{ inputs.workdir }}
      ref: ${{ inputs.ref }}
      repository: ${{ inputs.repository }}
      # classification-ggml builds the GGML_BACKEND_DL fabric (gpu-backends), so
      # the build host needs the Vulkan SDK (incl. glslc) to compile the
      # ggml-vulkan module from source on cache-miss — same as the other
      # gpu-backends consumers (vla/embed/llm/nmtcpp/ocr). The consumer-side
      # find_dependency(Vulkan) is separately removed under DL by qvac-fabric
      # 8828.0.2#5, but the fabric's own Vulkan backend build still needs it.
      include-vulkan-sdk: true
      fabric-overlay-artifact: ${{ inputs.fabric-overlay-artifact }}
      matrix-include: '[{"os":"ubuntu-24.04","runner_key":"ubuntu_2404","platform":"android","arch":"arm64"}]'
    secrets: inherit

  diagnostic-device-inventory:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2
      - name: List Android diagnostic candidates
        run: >-
          aws devicefarm list-devices
          --filters '[{"attribute":"PLATFORM","operator":"EQUALS","values":["ANDROID"]}]'
          --query 'devices[?contains(model, `Galaxy S2`) || contains(model, `Pixel 9 Pro`)].{model:model,os:os,availability:availability,cpu:cpu.model}'
          --output json
